<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Анімоване число</title>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500&display=swap" rel="stylesheet" />
  <style>
    html, body {
      background: transparent; /* фікс */
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-size: 5em;
      font-family: 'Rubik', sans-serif;
      user-select: none;
    }

    #number {
      padding: 0.2em 0.5em;
      border-radius: 0.3em;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
      transition: all 0.5s ease;
      color: white;
    }

    .pulse {
      animation: pulseScale 0.6s ease;
    }

    @keyframes pulseScale {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .increase {
      background: linear-gradient(45deg, white, red, white);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .decrease {
      background: linear-gradient(45deg, green, white, green);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stable {
      background: none;
      -webkit-background-clip: initial;
      -webkit-text-fill-color: white;
      color: white;
    }
  </style>
</head>
<body>
  <div id="number" class="stable">0</div>

  <script type="text/javascript">
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(init);

    let lastValue = null;
    const display = document.getElementById('number');
    let animationInterval = null;

    function init() {
      fetchData();
      setInterval(fetchData, 5000); // кожні 5 секунд
    }

    function fetchData() {
      const query = new google.visualization.Query(
        'https://docs.google.com/spreadsheets/d/17phnEn-NW-OnrZg4DcW65r-Xoq6ScsdVjS5yL0SS3fk/gviz/tq?sheet=WOT&range=C14'
      );
      query.send(handleQueryResponse);
    }

    function handleQueryResponse(response) {
      if (response.isError()) {
        console.warn('Помилка запиту:', response.getMessage());
        return;
      }

      const data = response.getDataTable();
      const raw = data.getValue(0, 0);
      let value = Number(raw);

      if (Number.isNaN(value)) {
        console.warn('Недійсне число:', raw);
        return;
      }

      value = Math.round(value); // <-- округлення до цілого

      if (animationInterval !== null) {
        clearInterval(animationInterval);
        animationInterval = null;
      }

      if (lastValue === null) {
        display.textContent = formatNumber(value);
        display.classList.add('stable');
        lastValue = value;
        return;
      }

      if (value === lastValue) {
        display.textContent = formatNumber(value);
        resetColor();
        return;
      }

      animateNumberChange(lastValue, value);
      lastValue = value;
    }

    function animateNumberChange(start, end) {
      const diff = end - start;
      if (diff === 0) {
        display.textContent = formatNumber(end);
        resetColor();
        return;
      }

      const direction = diff > 0 ? 1 : -1;
      const absDiff = Math.abs(diff);

      const totalDuration = 5000; // 5 секунд
      const maxSteps = 100;
      const stepCount = Math.min(absDiff, maxSteps);
      const stepSize = Math.ceil(absDiff / stepCount);
      const intervalTime = totalDuration / stepCount;

      setGradient(direction > 0 ? 'increase' : 'decrease');
      display.classList.remove('pulse');
      void display.offsetWidth; // форсуємо reflow
      display.classList.add('pulse');

      let current = start;

      animationInterval = setInterval(() => {
        current += direction * stepSize;

        if ((direction > 0 && current >= end) || (direction < 0 && current <= end)) {
          current = end;
        }

        display.textContent = formatNumber(current);

        if (current === end) {
          clearInterval(animationInterval);
          animationInterval = null;
          setTimeout(() => resetColor(), 300);
        }
      }, intervalTime);
    }

    function setGradient(type) {
      display.classList.remove('increase', 'decrease', 'stable');
      if (type === 'increase') display.classList.add('increase');
      else if (type === 'decrease') display.classList.add('decrease');
    }

    function resetColor() {
      display.classList.remove('increase', 'decrease', 'pulse');
      display.classList.add('stable');
    }

    function formatNumber(num) {
      const abs = Math.abs(num);
      if (abs >= 1_000_000) {
        const millions = Math.floor(num / 1_000_000);
        const thousands = Math.floor((Math.abs(num) % 1_000_000) / 1_000) * Math.sign(num);
        return `${millions}м ${Math.abs(thousands)}т`;
      }
      return num.toLocaleString('uk-UA');
    }
  </script>
</body>
</html>
