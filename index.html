<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Анімоване число</title>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500&display=swap" rel="stylesheet">
  <style>
    html, body {
      background: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-size: 5em;
      font-family: 'Rubik', sans-serif;
      user-select: none;
    }

    #number {
      padding: 0.2em 0.5em;
      border-radius: 0.3em;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
      transition: all 0.5s ease;
      color: white;
    }

    .pulse {
      animation: pulseScale 0.6s ease;
    }

    @keyframes pulseScale {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .increase {
      background: linear-gradient(45deg, white, red, white);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .decrease {
      background: linear-gradient(45deg, green, white, green);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stable {
      background: none;
      -webkit-background-clip: initial;
      -webkit-text-fill-color: white;
      color: white;
    }
  </style>
</head>
<body>
  <div id="number">0</div>

  <script type="text/javascript">
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(init);

    let currentValue = 0;
    const display = document.getElementById('number');
    let animationInterval = null; // 🔁 Контроль анімації

    function init() {
      fetchData();
      setInterval(fetchData, 5000); // кожні 5 секунд
    }

    function fetchData() {
      const query = new google.visualization.Query(
        'https://docs.google.com/spreadsheets/d/17phnEn-NW-OnrZg4DcW65r-Xoq6ScsdVjS5yL0SS3fk/gviz/tq?sheet=WOT&range=C14'
      );
      query.send(handleQueryResponse);
    }

    function handleQueryResponse(response) {
      if (response.isError()) {
        display.innerText = '';
        return;
      }

      const data = response.getDataTable();
      const value = data.getValue(0, 0);
      const newValue = Number(value);

      if (isNaN(newValue)) {
        console.warn('Недійсне число:', value);
        return;
      }

      // Зупинити поточну анімацію, якщо вона йде
      if (animationInterval !== null) {
        clearInterval(animationInterval);
        animationInterval = null;
      }

      // Поточне число беремо з екрана
      const currentDisplayed = parseDisplayedNumber(display.innerText);
      animateNumberChange(currentDisplayed, newValue);
      currentValue = newValue;
    }

    function animateNumberChange(start, end) {
      const diff = end - start;
      if (diff === 0) {
        display.innerText = formatNumber(end);
        resetColor();
        return;
      }

      const direction = diff > 0 ? 1 : -1;
      const absDiff = Math.abs(diff);
      const totalDuration = 1000; // 5 сек
      const intervalTime = totalDuration / absDiff;

      setGradient(direction > 0 ? 'increase' : 'decrease');
      display.classList.add('pulse');

      let current = start;

      animationInterval = setInterval(() => {
        current += direction;
        display.innerText = formatNumber(current);

        if (current === end) {
          clearInterval(animationInterval);
          animationInterval = null;
          setTimeout(() => resetColor(), 300);
        }
      }, intervalTime);
    }

    function setGradient(type) {
      display.classList.remove('increase', 'decrease', 'stable');
      if (type === 'increase') {
        display.classList.add('increase');
      } else if (type === 'decrease') {
        display.classList.add('decrease');
      }
    }

    function resetColor() {
      display.classList.remove('increase', 'decrease', 'pulse');
      display.classList.add('stable');
    }

    function formatNumber(num) {
      if (Math.abs(num) >= 1000000) {
        const millions = Math.floor(num / 1000000);
        const thousands = Math.floor((num % 1000000) / 1000);
        return millions + "м " + thousands + "т";
      } else {
        return num.toLocaleString('uk-UA');
      }
    }

    function parseDisplayedNumber(text) {
      // Обробляє формати типу "1м 500т" або "15 000"
      if (text.includes('м')) {
        const parts = text.split('м');
        const millions = parseInt(parts[0].trim()) || 0;
        const thousands = parseInt(parts[1].replace(/[^\d]/g, '')) || 0;
        return millions * 1000000 + thousands * 1000;
      } else {
        return parseInt(text.replace(/[^\d]/g, '')) || 0;
      }
    }
  </script>
</body>
</html>
