<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Анімоване число</title>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500&display=swap" rel="stylesheet">
  <style>
    html, body {
      background: transparent;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-size: 5em;
      font-family: 'Rubik', sans-serif;
      user-select: none;
    }

    #number {
      padding: 0.2em 0.5em;
      border-radius: 0.3em;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
      transition: color 0.5s ease, transform 0.3s ease;
      color: white;
    }

    /* Пульсація при зміні */
    .pulse {
      animation: pulseScale 0.6s ease;
    }

    @keyframes pulseScale {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.15);
      }
      100% {
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div id="number">0</div>

  <script type="text/javascript">
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(init);

    let currentValue = 0;
    const display = document.getElementById('number');

    function init() {
      fetchData();
      setInterval(fetchData, 15000); // кожні 15 секунд
    }

    function fetchData() {
      const query = new google.visualization.Query(
        'https://docs.google.com/spreadsheets/d/17phnEn-NW-OnrZg4DcW65r-Xoq6ScsdVjS5yL0SS3fk/gviz/tq?sheet=WOT&range=C14'
      );
      query.send(handleQueryResponse);
    }

    function handleQueryResponse(response) {
      if (response.isError()) {
        display.innerText = '';
        return;
      }

      const data = response.getDataTable();
      const newValue = data.getValue(0, 0);

      animateNumberChange(currentValue, newValue, 15000);
      currentValue = newValue;
    }

    function animateNumberChange(start, end, duration) {
      const steps = Math.min(Math.abs(end - start), 150);
      if (steps === 0) {
        display.innerText = formatNumber(end);
        display.style.color = 'white';
        return;
      }

      // Колір у зворотному порядку: зменшення — зелений, збільшення — червоний
      display.style.color = end > start ? 'red' : 'green';

      // Додаємо клас пульсації
      display.classList.add('pulse');

      const stepValue = (end - start) / steps;
      let current = start;
      let count = 0;

      const interval = setInterval(() => {
        current += stepValue;
        count++;
        display.innerText = formatNumber(Math.round(current));

        if (count >= steps) {
          clearInterval(interval);
          display.innerText = formatNumber(end);

          // Після завершення — повертаємо білий
          display.style.color = 'white';

          // Видаляємо клас пульсації після завершення
          display.classList.remove('pulse');
        }
      }, duration / steps);
    }

    function formatNumber(num) {
      if (Math.abs(num) >= 1000000) {
        const millions = Math.floor(num / 1000000);
        const thousands = Math.floor((num % 1000000) / 1000);
        return millions + "м " + thousands + "т";
      } else {
        return num.toLocaleString('uk-UA');
      }
    }
  </script>
</body>
</html>
